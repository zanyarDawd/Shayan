function productCard(p) {
  const st = STATUS[p.status];
  const u = unitLabel(p.unit);
  const target = p.threshold > 0 ? p.threshold * 3 : 0;
  const pct = p.status === 'out' ? 0 : target > 0 ? Math.min(100, (p.quantity / target) * 100) : 100;
  const mark = target > 0 ? (p.threshold / target) * 100 : null;

  return `<article class="p-card">
    <div class="p-media" data-action="detail" data-id="${p.id}" role="button" tabindex="0" aria-label="وردەکاری ${attr(p.name)}">
      ${p.image ? `<img src="${attr(p.image)}" alt="${attr(p.name)}" loading="lazy" />` : `<div class="placeholder">${icon('image')}<span>بێ وێنە</span></div>`}
      <span class="pill ${st.cls} p-status">${st.label}</span>
      ${p.category ? `<span class="p-cat">${esc(p.category)}</span>` : ''}
    </div>
    <div class="p-body">
      <div class="p-title-row">
        <h3 class="p-title">${esc(p.name)}</h3>
        <span class="p-unit-chip">${u}</span>
      </div>
      <div class="p-meta">${icon('clock')} ${esc(timeAgo(p.updatedAt))}</div>
      <div class="stock ${p.status}">
        <div class="qty-row">
          <span class="qty">${qtyText(p.quantity)}</span>
          <span class="unit">${u}</span>
          <span class="hint-qty">${p.status === 'out' ? 'تەواو بووە' : p.threshold > 0 ? `سنوور: ${qtyText(p.threshold)}` : 'بێ سنوور'}</span>
        </div>
        <div class="bar">
          <span class="bar-fill" style="width:${pct}%"></span>
          ${mark !== null ? `<span class="bar-mark" style="inset-inline-start:${mark}%"></span>` : ''}
        </div>
      </div>
      <div class="p-actions">
        <button class="btn btn-soft" data-action="restock" data-id="${p.id}">${icon('plus')} زیادکردن</button>
        <button class="btn btn-danger" data-action="report" data-id="${p.id}">${p.status === 'out' ? 'ڕاگەیاندن' : 'نەماوە'}</button>
        <button class="btn btn-icon" data-action="edit-product" data-id="${p.id}" aria-label="دەستکاری ${attr(p.name)}" title="دەستکاری">${icon('edit')}</button>
      </div>
    </div>
  </article>`;
}

              </section>`
            )
            .join('')
        : emptyState('bell', 'هیچ ئاگادارییەک نییە', 'کاتێک کاڵایەک کەم ببێتەوە یان نەماوە، لێرە دەردەکەوێت و ئاگاداری دەکرێیت.', '')
    }
  </div>`;
};

function notificationRow(n) {
  const type = n.type === 'out' ? 'out' : n.type === 'low' ? 'low' : n.type === 'announcement' ? 'announcement' : 'user';
  const ico = n.type === 'out' ? 'alertCircle' : n.type === 'low' ? 'alertTriangle' : n.type === 'announcement' ? 'megaphone' : 'info';
  return `<button class="note ${n.read ? '' : 'unread'}" data-action="open-note" data-id="${n.id}" type="button">
    <span class="note-icon ${type}">${icon(ico)}</span>
    <span class="note-body">
      <span class="note-title">${esc(n.title)}</span>
      <span class="note-text">${esc(n.body)}</span>
      <span class="note-time">${icon('clock')} ${esc(timeAgo(n.createdAt))}${n.actorName ? ` · ${esc(n.actorName)}` : ''}</span>
    </span>
    ${n.read ? '' : '<span class="unread-dot" aria-label="نەخوێندراوە"></span>'}
  </button>`;
}

function notificationGroups(list) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  const groups = [
    { label: 'ئەمڕۆ', items: [] },
    { label: 'دوێنێ', items: [] },
    { label: 'پێشتر', items: [] },
  ];
  for (const n of list) {
    const t = new Date(n.createdAt);
    if (t >= today) groups[0].items.push(n);
    else if (t >= yesterday) groups[1].items.push(n);
    else groups[2].items.push(n);
  }
  return groups.filter((g) => g.items.length);
}

/* --------------------------------------------------------------------------

VIEWS.account = function viewAccount() {
  const u = state.user;
  const isManager = u.role === 'manager';
  const notifSupported = 'Notification' in window;
  const perm = notifSupported ? Notification.permission : 'unsupported';

  const notifButton = !notifSupported
    ? '<span class="pill neutral no-dot">پشتگیری نەکراوە</span>'
    : perm === 'granted'
      ? '<span class="pill ok">چالاکە</span>'

        ? '<span class="pill out">بەربەستکراوە</span>'
        : `<button class="btn btn-sm btn-soft" data-action="request-notifications">چالاککردن</button>`;

  return `<div class="page">
    <div class="profile-hero">
      <div class="avatar">${esc(initials(u.name))}</div>
      <div class="grow">
        <h2>${esc(u.name)}</h2>
        <p>${esc(u.email || u.username)}</p>
        <span class="pill no-dot">${esc(roleLabel(u.role))}</span>

      <button class="btn btn-ghost btn-sm" data-action="logout">${icon('logout')} دەرچوون</button>
    </div>

    <div class="account-grid">

        <div class="panel-head"><span class="ico">${icon('user')}</span><h3>زانیاری کەسی</h3></div>

          <form data-form="profile" novalidate style="display:grid;gap:14px">

            </div>
            <div class="field">
              <label>ئیمەیڵی ئەکاونت</label>
              <input class="input" value="${attr(u.email || u.username)}" disabled style="direction:ltr;text-align:left;opacity:.7" />
              <span class="hint">چوونەژوورەوە بە Firebase Authentication پارێزراوە.</span>
            </div>
            <button class="btn btn-soft" data-submit>${icon('check')} پاشەکەوتکردن</button>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span class="ico">${icon('lock')}</span><h3>ئاسایشی ئەکاونت</h3></div>
        <div class="panel-body">
          <form data-form="password" novalidate style="display:grid;gap:14px">
            <div class="form-error" data-error></div>
            <div class="field">
              <label for="pwCurrent">وشەی نهێنی ئێستا</label>
              <input class="input" id="pwCurrent" name="current" type="password" autocomplete="current-password" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="pwNext">وشەی نهێنی نوێ</label>
                <input class="input" id="pwNext" name="next" type="password" autocomplete="new-password" minlength="6" required />
              </div>
              <div class="field">
                <label for="pwNext2">دووبارە</label>
                <input class="input" id="pwNext2" name="confirm" type="password" autocomplete="new-password" minlength="6" required />
              </div>
            </div>
            <button class="btn btn-soft" data-submit>${icon('key')} گۆڕینی وشەی نهێنی</button>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span class="ico">${icon('settings')}</span><h3>ڕێکخستن</h3></div>
        <div class="panel-body" style="padding-top:6px;padding-bottom:8px">
          <div class="setting-row">
            <div class="s-ico">${icon('moon')}</div>
            <div class="s-main"><b>ڕووکاری تاریک</b><span>بۆ شەوان و کەمکردنەوەی درۆنی چاو</span></div>
            <button class="switch" role="switch" data-action="toggle-theme" data-theme-switch aria-checked="${state.theme === 'dark'}"></button>
          </div>
          <div class="setting-row">
            <div class="s-ico">${icon('bell')}</div>
            <div class="s-main"><b>دەنگی ئاگاداری</b><span>دەنگێکی کورت لە کاتی هاتنی ئاگاداری</span></div>
            <button class="switch" role="switch" data-action="toggle-sound" aria-checked="${state.sound}"></button>
          </div>
          <div class="setting-row">
            <div class="s-ico">${icon('megaphone')}</div>
            <div class="s-main"><b>ئاگاداری مۆبایل</b><span>پیشاندانی ئاگاداری لە سیستەمی مۆبایل</span></div>
            ${notifButton}
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span class="ico">${icon(isManager ? 'settings' : 'info')}</span><h3>${isManager ? 'ڕێکخستنەکانی کۆگا' : 'ئامرازەکان'}</h3></div>

                    <label for="shopNameInput">ناوی دووکان</label>

            <button class="menu-item danger" data-action="logout">${icon('logout')} دەرچوون لە ئەکاونت ${icon('chevronLeft', 'chev')}</button>
          </div>
          <p class="hint">${esc(state.shopName)} · سیستەمی بەڕێوەبردنی کۆگا · وەشانی 1.0</p>
        </div>

    </div>
  </div>`;
};

/* --------------------------------------------------------------------------
   مۆداڵی کاڵا
   -------------------------------------------------------------------------- */
function openProductModal(product) {
  const p = product || null;
  const unit = p ? p.unit : 'piece';
  const cats = [...new Set(state.products.map((x) => x.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ckb'));
  const isManager = state.user.role === 'manager';

  openModal({
    html: `<form class="modal" data-form="product" data-id="${p ? p.id : ''}" novalidate>
      <div class="modal-head">
        <div class="m-ico">${icon(p ? 'edit' : 'plus')}</div>
        <div>
          <h3>${p ? 'دەستکاری کاڵا' : 'زیادکردنی کاڵای نوێ'}</h3>
          <p>${p ? 'بڕ، کێش، وێنە یان زانیارییەکان بگۆڕە.' : 'ناو و بڕی کاڵاکە بنووسە — دواتر دەتوانیت وێنەش زیاد بکەیت.'}</p>
        </div>
        <button type="button" class="modal-close" data-action="close-modal" aria-label="داخستن">${icon('x')}</button>
      </div>

      <div class="modal-body">
        <div class="form-error" data-error></div>

        <div class="img-field">
          <div class="img-preview" id="imgPreview">${p && p.image ? `<img src="${attr(p.image)}" alt="" />` : icon('image')}</div>
          <div class="img-side">
            <div class="row wrap">
              <label class="btn btn-sm btn-soft">${icon('upload')} هەڵبژاردنی وێنە<input type="file" id="imgInput" accept="image/*" hidden /></label>
              <button type="button" class="btn btn-sm btn-ghost" data-action="clear-image">سڕینەوە</button>
            </div>
            <span class="hint">JPG یان PNG · خۆکارانە بچووک دەکرێتەوە</span>
          </div>
        </div>
        <input type="hidden" name="imageData" id="imageData" value="" />
        <input type="hidden" name="imageCleared" id="imageCleared" value="0" />

        <div class="field">
          <label for="pName">ناوی کاڵا <span class="opt">پێویستە</span></label>
          <input class="input" id="pName" name="name" value="${p ? attr(p.name) : ''}" placeholder="بۆ نموونە: نۆک" maxlength="60" required />
        </div>

        <div class="field">
          <label for="pCategory">جۆر <span class="opt">ئارەزوومەندانە</span></label>
          <input class="input" id="pCategory" name="category" value="${p ? attr(p.category) : ''}" placeholder="بۆ نموونە: بەهارات، لوبیا..." maxlength="40" list="category-dl" />
          <datalist id="category-dl">${cats.map((c) => `<option value="${attr(c)}"></option>`).join('')}</datalist>
        </div>

        <div class="field">
          <span class="field-label">یەکەی پێوانە</span>
          <input type="hidden" name="unit" id="unitInput" value="${unit}" />
          <div class="segmented" role="group" aria-label="یەکەی پێوانە">
            <button type="button" data-action="set-unit" data-unit="piece" class="${unit === 'piece' ? 'active' : ''}">${icon('hash')} بڕ (دانە)</button>
            <button type="button" data-action="set-unit" data-unit="kg" class="${unit === 'kg' ? 'active' : ''}">${icon('scale')} کێش (کیلۆ)</button>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="pQty" id="qtyLabel">بڕی ئێستا <span class="opt">${unitLabel(unit)}</span></label>
            <input class="input" id="pQty" name="quantity" type="number" inputmode="decimal" min="0" step="any" value="${p ? p.quantity : ''}" placeholder="0" required />
          </div>
          <div class="field">
            <label for="pThreshold" id="thresholdLabel">سنووری ئاگاداری <span class="opt">${unitLabel(unit)}</span></label>
            <input class="input" id="pThreshold" name="threshold" type="number" inputmode="decimal" min="0" step="any" value="${p ? p.threshold : ''}" placeholder="بۆ نموونە: 5" />
          </div>
        </div>
        <span class="hint">کاتێک بڕ لە سنووری ئاگاداری کەمتر بێت، ئاگاداری بۆ هەموو تیم دەنێردرێت.</span>

        <div class="field">
          <label for="pNote">تێبینی <span class="opt">ئارەزوومەندانە</span></label>
          <textarea class="textarea" id="pNote" name="note" maxlength="300" placeholder="زانیاری زیادە، شوێنی هەڵگرتن، ...">${p ? esc(p.note) : ''}</textarea>
        </div>

        ${p && isManager ? `<button type="button" class="menu-item danger" data-action="delete-product" data-id="${p.id}" style="margin-top:2px;background:var(--danger-soft)">${icon('trash')} سڕینەوەی ئەم کاڵایە</button>` : ''}
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">پاشگەزبوونەوە</button>
        <button class="btn btn-primary" data-submit>${icon('check')} ${p ? 'پاشەکەوتکردن' : 'زیادکردن'}</button>
      </div>
    </form>`,
  });
}

/* --------------------------------------------------------------------------
   وردەکاری کاڵا
   -------------------------------------------------------------------------- */
function openDetailModal(p) {
  const st = STATUS[p.status];
  openModal({
    html: `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="m-ico">${icon('box')}</div>
        <div>

        <button type="button" class="modal-close" data-action="close-modal" aria-label="داخستن">${icon('x')}</button>
      </div>
      <div class="modal-body">
        ${
          p.image
            ? `<div style="border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2)"><img src="${attr(p.image)}" alt="${attr(p.name)}" style="width:100%;height:100%;object-fit:cover" /></div>`
            : ''
        }
        <div class="stock ${p.status}" style="padding:14px">
          <div class="qty-row">
            <span class="qty" style="font-size:32px">${qtyText(p.quantity)}</span>

        </div>
        <div class="detail-list">
          <div class="detail-row"><span>دۆخ</span><b><span class="pill ${st.cls}">${esc(st.label)}</span></b></div>
          <div class="detail-row"><span>بڕی ئێستا</span><b>${qtyText(p.quantity)} ${unitLabel(p.unit)}</b></div>
          <div class="detail-row"><span>سنووری ئاگاداری</span><b>${p.threshold > 0 ? `${qtyText(p.threshold)} ${unitLabel(p.unit)}` : 'دیاری نەکراوە'}</b></div>
          <div class="detail-row"><span>یەکەی پێوانە</span><b>${unitLong(p.unit)}</b></div>
          <div class="detail-row"><span>دوایین نوێکردنەوە</span><b>${esc(timeAgo(p.updatedAt))}${p.updatedBy ? ` · ${esc(p.updatedBy)}` : ''}</b></div>
        </div>
        ${p.note ? `<p class="small muted" style="line-height:1.9">${esc(p.note)}</p>` : ''}

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">داخستن</button>
        <button class="btn btn-soft" data-action="restock" data-id="${p.id}">${icon('plus')} زیادکردن</button>
        <button class="btn btn-primary" data-action="edit-product" data-id="${p.id}">${icon('edit')} دەستکاری</button>
      </div>
    </div>`,
  });
}

/* --------------------------------------------------------------------------
   زیادکردنی بڕ
   -------------------------------------------------------------------------- */
function openRestockModal(p) {
  const isKg = p.unit === 'kg';
  const quick = isKg ? [0.5, 1, 5, 10] : [1, 5, 10, 25];
  openModal({
    html: `<form class="modal" data-form="restock" data-id="${p.id}" novalidate>
      <div class="modal-head">
        <div class="m-ico">${icon('plus')}</div>
        <div><h3>زیادکردنی بڕ</h3><p>${esc(p.name)} — ئێستا ${qtyText(p.quantity)} ${unitLabel(p.unit)} هەیە.</p></div>
        <button type="button" class="modal-close" data-action="close-modal" aria-label="داخستن">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <div class="form-error" data-error></div>
        <div class="field">
          <label for="amountInput">چەند ${isKg ? 'کیلۆ' : 'دانە'} زیاد دەکرێت؟</label>
          <input class="input" id="amountInput" name="amount" type="number" inputmode="decimal" min="0" step="${isKg ? '0.1' : '1'}" placeholder="0" required />
        </div>
        <div class="quick-amounts">
          ${quick.map((q) => `<button type="button" class="chip" data-action="amount-chip" data-amount="${q}">+${qtyText(q)} ${isKg ? 'کیلۆ' : 'دانە'}</button>`).join('')}
        </div>
        <div class="detail-list">
          <div class="detail-row"><span>دوای زیادکردن</span><b id="afterRestock">—</b></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">پاشگەزبوونەوە</button>
        <button class="btn btn-primary" data-submit>${icon('plus')} زیادکردن</button>
      </div>
    </form>`,
    onMount(root) {
      const input = root.querySelector('#amountInput');
      const after = root.querySelector('#afterRestock');
      const update = () => {
        const n = Number(input.value);
        after.textContent = Number.isFinite(n) && n > 0 ? `${qtyText(p.quantity + n)} ${unitLabel(p.unit)}` : '—';
      };
      input.addEventListener('input', update);
    },
  });
}

/* --------------------------------------------------------------------------

        </div>

        <div id="reportQtyWrap" class="field hidden">
          <label for="reportQty">چەن ماوە؟ <span class="opt">ئارەزوومەندانە</span></label>

          <span class="hint">ئەگەر بەتاڵ بهێڵیت، بڕی ئێستا (${qtyText(p.quantity)} ${unitLabel(p.unit)}) بەکار دەهێنرێت.</span>

      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">پاشگەزبوونەوە</button>
        <button class="btn btn-danger" data-submit>${icon('bell')} ڕاگەیاندن بۆ هەمووان</button>
      </div>

}

        <div class="field">
          <label for="annBody">پەیام</label>
          <textarea class="textarea" id="annBody" name="body" maxlength="400" placeholder="ناوەڕۆکی ئاگاداری..." required></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">پاشگەزبوونەوە</button>
        <button class="btn btn-primary" data-submit>${icon('megaphone')} ناردن</button>
      </div>
    </form>`,
  });
}

function confirmDialog({ title, text, confirmLabel, danger = false, onConfirm }) {
  pendingConfirm = onConfirm;
  openModal({
    html: `<div class="modal" style="max-width:440px" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="m-ico ${danger ? 'danger' : 'warn'}">${icon('alertTriangle')}</div>
        <div><h3>${esc(title)}</h3></div>
        <button type="button" class="modal-close" data-action="close-modal" aria-label="داخستن">${icon('x')}</button>
      </div>
      <div class="modal-body"><p class="confirm-text">${text}</p></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">پاشگەزبوونەوە</button>
        <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-action="confirm-yes">${esc(confirmLabel)}</button>
      </div>
    </div>`,
  });
}

/* --------------------------------------------------------------------------
   کردارەکان
   -------------------------------------------------------------------------- */
document.addEventListener('click', async (event) => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'reload':
      location.reload();
      return;

    case 'nav':
      event.preventDefault();
      navigate(target.dataset.view);
      return;

    case 'export-csv': {
      event.preventDefault();
      const rows = [
        ['ناو', 'جۆر', 'یەکە', 'بڕ', 'سنووری ئاگاداری', 'دۆخ', 'دوایین نوێکردنەوە'],
        ...state.products.map((product) => [
          product.name,
          product.category || '',
          unitLabel(product.unit),
          String(product.quantity),
          String(product.threshold),
          product.status === 'out' ? 'نەماوە' : product.status === 'low' ? 'کەم' : 'بەردەست',
          new Date(product.updatedAt).toISOString().slice(0, 10),
        ]),
      ];
      const csv = '\uFEFF' + rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'shayan-products.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return;
    }

    case 'logout': {
      try {
        await api('/api/logout', { method: 'POST' });
      } catch {
        /* ignore */
      }
      state.stream?.close();
      state.stream = null;
      state.user = null;
      closeModal();
      window.history.replaceState(null, '', `${location.pathname}${location.search}`);
      renderAuth();
      toast({ title: 'دەرچوویت', text: 'بە سەرکەوتوویی لە ئەکاونتەکەت دەرچوویت.' });
      return;
    }

    case 'toggle-theme':
      toggleTheme();
      return;

    case 'toggle-sound': {
      state.sound = !state.sound;
      localStorage.setItem('shayan.sound', state.sound ? '1' : '0');
      document.querySelectorAll('[data-action="toggle-sound"][role="switch"]').forEach((el) => el.setAttribute('aria-checked', String(state.sound)));
      if (state.sound) {
        unlockAudio();
        chime('info');
      }
      toast({ title: state.sound ? 'دەنگی ئاگاداری چالاک کرا' : 'دەنگی ئاگاداری ناچالاک کرا', type: 'info' });
      return;
    }

    case 'toggle-password': {
      const field = target.closest('.password-field');
      const input = field?.querySelector('input');
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      target.innerHTML = icon(show ? 'eyeOff' : 'eye');
      target.setAttribute('aria-label', show ? 'شاردنەوەی وشەی نهێنی' : 'پیشاندانی وشەی نهێنی');
      return;
    }

    case 'add-product':
      openProductModal(null);
      return;

    case 'edit-product': {
      const p = state.products.find((x) => x.id === target.dataset.id);
      if (p) openProductModal(p);
      return;
    }

    case 'detail': {
      const p = state.products.find((x) => x.id === target.dataset.id);
      if (p) openDetailModal(p);
      return;
    }

    case 'restock': {
      const p = state.products.find((x) => x.id === target.dataset.id);
      if (p) openRestockModal(p);
      return;
    }

    case 'report': {
      const p = state.products.find((x) => x.id === target.dataset.id);
      if (p) openReportModal(p);
      return;
    }

    case 'delete-product': {
      const p = state.products.find((x) => x.id === target.dataset.id);
      if (!p) return;
      confirmDialog({
        title: 'سڕینەوەی کاڵا',
        text: `دڵنیایت لە سڕینەوەی <b>«${esc(p.name)}»</b>؟ ئەم کارە گەڕانەوەی نییە و وێنەکەیشی دەسڕێتەوە.`,
        confirmLabel: 'سڕینەوە',
        danger: true,
        onConfirm: async () => {
          await api(`/api/products/${p.id}`, { method: 'DELETE' });
          state.products = state.products.filter((x) => x.id !== p.id);
          renderView({ keepScroll: true });
          toast({ title: 'سڕایەوە', text: `«${p.name}» لە کۆگا سڕایەوە.` });
        },
      });
      return;
    }

    case 'set-unit': {
      const form = target.closest('form');
      const unit = target.dataset.unit === 'kg' ? 'kg' : 'piece';
      if (!form) return;
      const input = form.querySelector('#unitInput');
      if (input) input.value = unit;
      form.querySelectorAll('[data-action="set-unit"]').forEach((b) => b.classList.toggle('active', b === target));
      const label = unitLabel(unit);
      const qtyOpt = form.querySelector('#qtyLabel .opt');
      const thOpt = form.querySelector('#thresholdLabel .opt');
      if (qtyOpt) qtyOpt.textContent = label;
      if (thOpt) thOpt.textContent = label;
      const qty = form.querySelector('#pQty');
      const th = form.querySelector('#pThreshold');
      if (qty) qty.step = unit === 'kg' ? 'any' : '1';
      if (th) th.step = unit === 'kg' ? 'any' : '1';
      return;
    }

    case 'set-report-level': {
      const form = target.closest('form');
      const level = target.dataset.level === 'low' ? 'low' : 'out';
      if (!form) return;
      const input = form.querySelector('#reportLevel');
      if (input) input.value = level;
      form.querySelectorAll('[data-action="set-report-level"]').forEach((b) => b.classList.toggle('active', b === target));
      form.querySelector('#reportQtyWrap')?.classList.toggle('hidden', level === 'out');
      const quick = form.querySelector('#reportQuick');
      if (quick) quick.style.display = level === 'low' ? 'flex' : 'none';
      return;
    }

    case 'report-chip': {
      const form = target.closest('form');
      const input = form?.querySelector('#reportQty');
      if (input) input.value = target.dataset.amount;
      return;
    }

    case 'amount-chip': {
      const form = target.closest('form');
      const input = form?.querySelector('#amountInput');
      if (input) {
        input.value = target.dataset.amount;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }

    case 'clear-image': {
      const form = target.closest('form');
      if (!form) return;
      const preview = form.querySelector('#imgPreview');
      const data = form.querySelector('#imageData');
      const cleared = form.querySelector('#imageCleared');
      if (preview) preview.innerHTML = icon('image');
      if (data) data.value = '';
      if (cleared) cleared.value = '1';
      return;
    }

    case 'generate-password': {
      const form = target.closest('form');
      const input = form?.querySelector('#uPass');
      if (input) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
        let out = '';
        const arr = new Uint32Array(10);
        crypto.getRandomValues(arr);
        for (const n of arr) out += chars[n % chars.length];
        input.type = 'text';
        input.value = out;
        input.focus();
        input.select();
        toast({ title: 'وشەی نهێنی دروستکرا', text: 'لەبەرگرتنەوەی پێویستە — دواتر ناتوانرێت ببینرێت.', type: 'info' });
      }
      return;
    }

    case 'close-modal':
      closeModal();
      return;

    case 'confirm-yes': {
      if (!pendingConfirm) return;
      const fn = pendingConfirm;
      pendingConfirm = null;
      setBusy(target, true);
      try {
        await fn();
        if (modalRoot.classList.contains('open')) closeModal();
      } catch (err) {
        setBusy(target, false);
        toastError(err);
      }
      return;
    }

    case 'mark-all-read': {
      try {
        await api('/api/notifications/read', { method: 'POST', body: { all: true } });
        state.notifications = state.notifications.map((n) => ({ ...n, read: true }));
        state.unread = 0;
        refreshBadges();
        renderView({ keepScroll: true });
        toast({ title: 'هەموو ئاگادارییەکان خوێندرانەوە', type: 'info' });
      } catch (err) {
        toastError(err);
      }
      return;
    }

    case 'open-note': {
      const note = state.notifications.find((n) => n.id === target.dataset.id);
      if (!note) return;
      if (!note.read) {
        try {
          await api('/api/notifications/read', { method: 'POST', body: { ids: [note.id] } });
          note.read = true;
          state.unread = Math.max(0, state.unread - 1);
          refreshBadges();
        } catch {
          /* ignore */
        }
      }
      const p = state.products.find((x) => x.id === note.productId);
      if (p) openDetailModal(p);
      else renderView({ keepScroll: true });
      return;
    }

    case 'announce':
      openAnnounceModal();
      return;

    case 'add-user':
      openUserModal(null);
      return;

    case 'edit-user': {
      const u = state.users.find((x) => x.id === target.dataset.id);
      if (u) openUserModal(u);
      return;
    }

    case 'toggle-user': {
      const u = state.users.find((x) => x.id === target.dataset.id);
      if (!u) return;
      target.disabled = true;
      try {
        const data = await api(`/api/users/${u.id}`, { method: 'PATCH', body: { active: !(u.active !== false) } });
        Object.assign(u, data.user);
        renderView({ keepScroll: true });
        toast({ title: data.user.active ? 'ئەکاونت چالاک کرا' : 'ئەکاونت ناچالاک کرا', text: data.user.name, type: 'info' });
      } catch (err) {
        toastError(err);
      } finally {
        target.disabled = false;
      }
      return;
    }

    case 'delete-user': {
      const u = state.users.find((x) => x.id === target.dataset.id);
      if (!u) return;
      confirmDialog({
        title: 'سڕینەوەی ئەکاونت',
        text: `دڵنیایت لە سڕینەوەی ئەکاونتی <b>«${esc(u.name)}»</b>؟ دەستگەیشتنی ئەم کەسە بە سیستەم دەپچڕێت.`,
        confirmLabel: 'سڕینەوە',
        danger: true,
        onConfirm: async () => {
          await api(`/api/users/${u.id}`, { method: 'DELETE' });
          state.users = state.users.filter((x) => x.id !== u.id);
          renderView({ keepScroll: true });
          toast({ title: 'ئەکاونت سڕایەوە', text: u.name });
        },
      });
      return;
    }

    case 'request-notifications': {
      if (!('Notification' in window)) {
        toast({ title: 'پشتگیری نەکراوە', text: 'ئەم وێبگەڕە ئاگاداری سیستەم پشتگیری ناکات.', type: 'warn' });
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          toast({ title: 'ئاگاداری چالاک کرا', text: 'لە کاتی کەمبوونەوەی کاڵا ئاگاداریش لە سیستەم دەبینیت.' });
          chime('info');
        } else {
          toast({ title: 'ڕێگە نەدرا', text: 'دەتوانیت دواتر لە ڕێکخستنەکانی وێبگەڕەکە بیگۆڕیت.', type: 'warn' });
        }
        renderView({ keepScroll: true });
      } catch (err) {
        toastError(err);
      }
      return;
    }

    case 'focus-search': {
      if (state.view !== 'products') {
        navigate('products');
        setTimeout(() => document.getElementById('searchInput')?.focus(), 60);
      } else {
        document.getElementById('searchInput')?.focus();
      }
      return;
    }

    case 'filter-status':
      state.status = target.dataset.status || 'all';
      renderView({ keepScroll: true });
      return;

    case 'reset-filters':
      state.q = '';
      state.status = 'all';
      state.category = 'all';
      renderView({ keepScroll: true });
      return;

    case 'refresh-state':
      await syncState();
      toast({ title: 'نوێکرایەوە', text: 'داتاکان نوێکرانەوە.', type: 'info' });
      return;

    default:
  }
});

/* --------------------------------------------------------------------------
   فۆرمەکان
   -------------------------------------------------------------------------- */
document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  const kind = form.dataset.form;
  const btn = form.querySelector('[data-submit]');
  const fd = new FormData(form);
  formError(form, '');

  try {
    if (kind === 'login') {
      const email = String(fd.get('email') || '').trim();
      const password = String(fd.get('password') || '');
      if (!email || !password) throw new Error('ئیمەیڵ و وشەی نهێنی پێویستە.');
      setBusy(btn, true);
      const data = await api('/api/login', { method: 'POST', body: { email, password } });
      applyState(data);
      state.view = 'dashboard';
      renderShell();
      connectStream();
      toast({ title: 'بەخێربێیتەوە 👋', text: `${state.user.name} — ئێستا دەتوانیت کۆگاکە بەڕێوە ببەیت.` });
      setBusy(btn, false);
      return;
    }

    if (kind === 'setup') {
      const password = String(fd.get('password') || '');
      if (password !== String(fd.get('confirm') || '')) throw new Error('وشەی نهێنی و دووبارەکردنەوەی یەک نین.');
      if (password.length < 6) throw new Error('وشەی نهێنی دەبێت لانیکەم ٦ پیت بێت.');
      setBusy(btn, true);
      const data = await api('/api/setup', {
        method: 'POST',
        body: {
          shopName: String(fd.get('shopName') || '').trim() || 'کۆگای شایەن',
          name: String(fd.get('name') || '').trim(),
          username: String(fd.get('username') || '').trim(),
          password,
        },
      });
      applyState(data);
      state.view = 'dashboard';
      renderShell();
      connectStream();
      toast({ title: 'سیستەم ڕێکخرا 🎉', text: 'ئەکاونتی بەڕێوەبەر دروستکرا. ئێستا کاڵاکانت زیاد بکە.' });
      setBusy(btn, false);
      return;
    }

    if (kind === 'product') {
      const name = String(fd.get('name') || '').trim();
      if (!name) throw new Error('ناوی کاڵا پێویستە.');
      const quantity = numValue(fd.get('quantity'), 0);
      const threshold = numValue(fd.get('threshold'), 0);
      if (Number.isNaN(quantity) || quantity < 0) throw new Error('بڕ دەبێت ژمارەیەکی دروست بێت.');
      if (Number.isNaN(threshold) || threshold < 0) throw new Error('سنووری ئاگاداری دەبێت ژمارەیەکی دروست بێت.');

      const payload = {
        name,
        category: String(fd.get('category') || '').trim(),
        unit: String(fd.get('unit') || 'piece'),
        quantity,
        threshold,
        note: String(fd.get('note') || '').trim(),
      };
      const imageData = String(fd.get('imageData') || '');
      if (imageData) payload.imageData = imageData;
      else if (String(fd.get('imageCleared') || '0') === '1') payload.image = '';

      const id = form.dataset.id;
      setBusy(btn, true);
      const data = id
        ? await api(`/api/products/${id}`, { method: 'PATCH', body: payload })
        : await api('/api/products', { method: 'POST', body: payload });
      mergeProduct(data.product);
      closeModal();
      renderView({ keepScroll: true });
      toast({
        title: id ? 'دەستکاری کرا' : 'کاڵا زیادکرا',
        text: `«${name}» ${id ? 'نوێکرایەوە' : 'بە سەرکەوتوویی تۆمارکرا'}.`,
      });
      return;
    }

    if (kind === 'restock') {
      const id = form.dataset.id;
      const amount = numValue(fd.get('amount'), NaN);
      if (!Number.isFinite(amount) || amount <= 0) throw new Error('بڕی زیادکراو دەبێت لە سفر گەورەتر بێت.');
      setBusy(btn, true);
      const data = await api(`/api/products/${id}/restock`, { method: 'POST', body: { amount } });
      mergeProduct(data.product);
      closeModal();
      renderView({ keepScroll: true });
      toast({
        title: 'بڕ زیادکرا',
        text: `«${data.product.name}» — ئێستا ${qtyText(data.product.quantity)} ${unitLabel(data.product.unit)}.`,
      });
      return;
    }

    if (kind === 'report') {
      const id = form.dataset.id;
      const level = String(fd.get('level') || 'out');
      const body = { level };
      if (level === 'low') {
        const raw = fd.get('quantity');
        if (raw !== null && String(raw).trim() !== '') {
          const qty = numValue(raw, NaN);
          if (!Number.isFinite(qty) || qty < 0) throw new Error('بڕ دەبێت ژمارەیەکی دروست بێت.');
          body.quantity = qty;
        }
      }
      setBusy(btn, true);
      const data = await api(`/api/products/${id}/report`, { method: 'POST', body });
      mergeProduct(data.product);
      closeModal();
      renderView({ keepScroll: true });
      toast({
        title: 'ڕاپۆرت نێردرا',
        text: `ئاگاداری بۆ هەموو بەکارهێنەران نێردرا — «${data.product.name}».`,
        type: level === 'out' ? 'warn' : 'info',
        timeout: 6500,
      });
      return;
    }

    if (kind === 'user') {
      const id = form.dataset.id;
      const name = String(fd.get('name') || '').trim();
      const email = String(fd.get('email') || '').trim().toLowerCase();
      const password = String(fd.get('password') || '');
      if (!name) throw new Error('ناوی تەواو پێویستە.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('تکایە ئیمەیڵێکی دروست بنووسە.');
      if (!id && !password) throw new Error('وشەی نهێنی پێویستە.');
      if (password && password.length < 6) throw new Error('وشەی نهێنی دەبێت لانیکەم ٦ پیت بێت.');

      const payload = { name, email };
      if (password) payload.password = password;

      setBusy(btn, true);
      const data = id ? await api(`/api/users/${id}`, { method: 'PATCH', body: payload }) : await api('/api/users', { method: 'POST', body: payload });
      if (id) {
        const i = state.users.findIndex((u) => u.id === id);
        if (i >= 0) state.users[i] = data.user;
      } else {
        state.users.push(data.user);
      }
      closeModal();
      renderView({ keepScroll: true });
      toast({
        title: id ? 'ئەکاونت نوێکرایەوە' : 'ئەکاونت دروستکرا',
        text: `${data.user.name} (${data.user.email || data.user.username})`,
      });
      return;
    }

    if (kind === 'announce') {
      const title = String(fd.get('title') || '').trim();
      const body = String(fd.get('body') || '').trim();
      if (!title) throw new Error('ناونیشان پێویستە.');
      if (!body) throw new Error('پەیام پێویستە.');
      setBusy(btn, true);
      await api('/api/notifications', { method: 'POST', body: { title, body } });
      closeModal();
      toast({
        title: 'ئاگاداری نێردرا',
        text: 'پەیامەکە لە Firebase پاشەکەوت کرا و بۆ هەموو بەکارهێنەران دەردەکەوێت.',
      });
      return;
    }

    if (kind === 'profile') {
      const name = String(fd.get('name') || '').trim();
      if (!name) throw new Error('ناو پێویستە.');
      setBusy(btn, true);
      const data = await api('/api/account/profile', { method: 'PATCH', body: { name } });
      state.user = data.user;
      const y = window.scrollY;
      renderShell();
      window.scrollTo(0, y);
      toast({ title: 'پاشەکەوتکرا', text: 'ناوەکەت نوێکرایەوە.' });
      return;
    }

    if (kind === 'password') {
      const current = String(fd.get('current') || '');
      const next = String(fd.get('next') || '');
      if (!current) throw new Error('وشەی نهێنی ئێستا پێویستە.');
      if (next.length < 6) throw new Error('وشەی نهێنی نوێ دەبێت لانیکەم ٦ پیت بێت.');
      if (next !== String(fd.get('confirm') || '')) throw new Error('وشەی نهێنی نوێ و دووبارەکردنەوەی یەک نین.');
      setBusy(btn, true);
      await api('/api/account/password', { method: 'POST', body: { current, next } });
      form.reset();
      toast({ title: 'وشەی نهێنی گۆڕدرا', text: 'لە چوونەژوورەوەی داهاتوودا وشەی نهێنی نوێ بەکاربهێنە.' });
      return;
    }

    if (kind === 'shop') {
      const shopName = String(fd.get('shopName') || '').trim();
      if (!shopName) throw new Error('ناوی دووکان پێویستە.');
      setBusy(btn, true);
      const data = await api('/api/settings', { method: 'PATCH', body: { shopName } });
      state.shopName = data.shopName;
      const y = window.scrollY;
      renderShell();
      window.scrollTo(0, y);
      toast({ title: 'پاشەکەوتکرا', text: 'ناوی دووکان نوێکرایەوە.' });
      return;
    }
  } catch (err) {
    formError(form, err instanceof Error ? err.message : String(err));
    if (kind === 'login' || kind === 'setup') form.querySelector('input')?.focus();
  } finally {
    setBusy(btn, false);
  }
});

/* --------------------------------------------------------------------------
   گۆڕانکارییەکانی خانەکان
   -------------------------------------------------------------------------- */
document.addEventListener('input', (event) => {
  if (event.target.id === 'searchInput') {
    state.q = event.target.value;
    refreshProductResults();
  }
});

document.addEventListener('change', async (event) => {
  const el = event.target;

  if (el.id === 'imgInput') {
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      const dataUrl = await fileToDataUrl(file);
      const form = el.closest('form');
      const preview = form.querySelector('#imgPreview');
      const data = form.querySelector('#imageData');
      const cleared = form.querySelector('#imageCleared');
      if (preview) {
        preview.innerHTML = '';
        const img = document.createElement('img');
        img.alt = '';
        img.src = dataUrl;
        preview.appendChild(img);
      }
      if (data) data.value = dataUrl;
      if (cleared) cleared.value = '0';
      toast({ title: 'وێنە هەڵبژێردرا', type: 'info', timeout: 2600 });
    } catch (err) {
      toastError(err);
    }
    return;
  }

  if (el.id === 'categoryFilter') {
    state.category = el.value;
    refreshProductResults();
    return;
  }

  if (el.id === 'sortSelect') {
    state.sort = el.value;
    refreshProductResults();
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modalRoot.classList.contains('open')) {
    closeModal();
    return;
  }
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.p-media[role="button"]')) {
    event.preventDefault();
    event.target.click();
  }
});

/* --------------------------------------------------------------------------
   SSE — ئاگاداری خۆکار
   -------------------------------------------------------------------------- */
function connectStream() {
  if (!state.user) return;
  if (window.SHAYAN_STATIC_MODE) {
    window.ShayanStaticApi.subscribe();
    return;
  }
  state.stream?.close();
  let es;
  try {
    es = new EventSource('/api/stream');
  } catch {
    return;
  }
  state.stream = es;

  es.addEventListener('notification', (event) => {
    try {
      onIncomingNotification(JSON.parse(event.data));
    } catch {
      /* ignore */
    }
  });

  es.addEventListener('product', (event) => {
    try {
      mergeProduct(JSON.parse(event.data));
    } catch {
      /* ignore */
    }
  });

  es.addEventListener('product-deleted', (event) => {
    try {
      const { id } = JSON.parse(event.data);
      state.products = state.products.filter((p) => p.id !== id);
      softRefresh();
    } catch {
      /* ignore */
    }
  });

  es.addEventListener('activity', (event) => {
    try {
      const activity = JSON.parse(event.data);
      if (!state.activities.some((a) => a.id === activity.id)) {
        state.activities.unshift(activity);
        state.activities = state.activities.slice(0, 80);
      }
      if (['dashboard', 'activity'].includes(state.view)) softRefresh();
    } catch {
      /* ignore */
    }
  });

  es.addEventListener('users', () => {
    syncState();
  });

  es.onerror = () => {
    state.streamWasDown = true;
  };

  es.onopen = () => {
    if (state.streamWasDown) {
      state.streamWasDown = false;
      syncState();
    }
  };
}

window.addEventListener('shayan-shared-data', () => {
  if (window.SHAYAN_STATIC_MODE && state.user) syncState();
});

window.addEventListener('shayan-shared-data-error', (event) => {
  if (window.SHAYAN_STATIC_MODE && state.user) {
    toast({ title: 'هەڵەی پەیوەندی داتابەیس', text: event.detail, type: 'error', timeout: 8000 });
  }
});

function onIncomingNotification(note) {
  if (!note || state.notifications.some((x) => x.id === note.id)) return;
  const n = { ...note, read: false };
  state.notifications.unshift(n);
  state.notifications = state.notifications.slice(0, 150);
  state.unread += 1;
  refreshBadges();

  if (note.actorId !== state.user.id) {
    chime(note.type === 'out' ? 'out' : note.type === 'low' ? 'low' : 'info');
    toast({
      title: note.title,
      text: note.body,
      type: note.type === 'out' ? 'error' : note.type === 'low' ? 'warn' : 'info',
      timeout: 7500,
    });
    browserNotify(n);
  }
  softRefresh();
}

function mergeProduct(product) {
  if (!product) return;
  const i = state.products.findIndex((p) => p.id === product.id);
  if (i >= 0) state.products[i] = product;
  else state.products.push(product);
  state.products.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  softRefresh();
}

async function syncState() {
  try {
    const data = await api('/api/state');
    applyState(data);
    refreshBadges();
    softRefresh();
  } catch (err) {
    if (err && err.status === 401) handleSessionLost();
  }
}

/* --------------------------------------------------------------------------
   ڕووداوەکانی گەشتکردن
   -------------------------------------------------------------------------- */
window.addEventListener('popstate', () => {
  const view = location.hash.slice(1);
  if (VIEW_TITLES[view] && view !== state.view) {
    state.view = view;
    renderView();
  }
});

window.addEventListener('hashchange', () => {
  const view = location.hash.slice(1);
  if (VIEW_TITLES[view] && view !== state.view) {
    state.view = view;
    renderView();
  }
});

/* --------------------------------------------------------------------------
   دەستپێکردن
   -------------------------------------------------------------------------- */
boot();

    </script>
  </body>
</html>
